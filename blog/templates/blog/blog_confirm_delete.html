{% extends "catalog/base.html" %}
{% load blog_my_tags %}
{% block content %}

<section class="py-5 text-center container">
  <div class="row py-lg-5">
    <div class="col-lg-6 col-md-8 mx-auto">
      <h1 class="fw-light">Удаление</h1>
      <p class="lead text-body-secondary">Ну если совсем не нравится, то удаляй</p>
      <p>
        <a href="#" class="btn btn-primary my-2">Кнопка, синяя</a>
        <a href="#" class="btn btn-secondary my-2">Кнопка, серая</a>
      </p>
    </div>
  </div>
</section>

<p>Вы действительно хотите удалить {{ product.name }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Подтвердить</button>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-outline-success">Отмена</a>
</form>
{% endblock %}
