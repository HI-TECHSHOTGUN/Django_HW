{% extends "blog/base.html" %}
{% load my_tags %}
{% block content %}

<section class="py-5 text-center container">
  <div class="row py-lg-5">
    <div class="col-lg-6 col-md-8 mx-auto">
      <h1 class="fw-light">Создайте новый пост</h1>
      <p class="lead text-body-secondary">Я не знаю чем дополнить заполните форму пожалуйста</p>
      <p>
        <a href="#" class="btn btn-primary my-2">Кнопка, синяя</a>
        <a href="#" class="btn btn-secondary my-2">Кнопка, серая</a>
      </p>
    </div>
  </div>
</section>

<form method="post" action="" enctype="multipart/form-data">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit" class="btn btn-warning">Сохранить</button>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-outline-success">Отмена</a>
</form>
{% endblock %}
