{% extends "catalog/base.html" %}
{% load my_tags %}
{% block content %}

<section class="py-5 text-center container">
  <div class="row py-lg-5">
    <div class="col-lg-6 col-md-8 mx-auto">
      <h1 class="fw-light">Продукты в категории: {{ category_name }}</h1>
      <p class="lead text-body-secondary">Все товары этой категории</p>
      <p>
        <a href="{% url 'catalog:home' %}" class="btn btn-primary my-2">На главную</a>
      </p>
    </div>
  </div>
</section>

<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for product in products_category %}
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{ product.photo | media_filter }}">
            <div class="card-body">
              <h3 class="card-text">{{ product.name | truncatechars:100}}</h3>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a href="{% url 'catalog:details' product.pk %}" class="btn btn-outline-success">Подробнее</a>
                </div>
                <small class="text-body-secondary">{{ product.updated_at }}</small>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
</div>
{% endblock %}
