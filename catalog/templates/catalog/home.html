{% extends "catalog/base.html" %}
{% load my_tags %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for product in products %}
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{ product.photo | media_filter }}">
            <div class="card-body">
              <h3 class="card-text">{{ product.name | truncatechars:100}}</h3>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a href="{% url 'catalog:details' product.pk %}" class="btn btn-outline-success">Подробнее</a>
                </div>
                <small class="text-body-secondary">0 sec</small>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
</div>
{% endblock %}
